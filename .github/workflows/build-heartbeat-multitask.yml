name: Build RikkaHub Jude APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/heartbeat-multi-task

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Prepare build-only Google Services config
        shell: bash
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "rikkahub-local-build",
              "storage_bucket": "rikkahub-local-build.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "me.rerere.rikkahub.jude.debug.test"
                  }
                },
                "api_key": [
                  {
                    "current_key": "BUILD_ONLY_NOT_A_REAL_API_KEY"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Build universal public debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assemblePublicDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-jude-heartbeat-multitask-debug
          path: app/build/outputs/apk/public/debug/*.apk
          if-no-files-found: error
          retention-days: 14
